name: CI/CD Build and Deploy to OCI

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip npm tests for this deployment'
        required: false
        default: false
        type: boolean

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install frontend test dependencies
        run: npm ci --prefix client

      - name: Run tests
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_tests != true }}
        run: npm run test

      - name: Confirm tests were skipped by request
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_tests == true }}
        run: echo "Tests skipped for this manually requested deployment."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 登入 GitHub Packages (GHCR) 以儲存 Docker 映像檔
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 建置並推送 Docker 映像檔到 GHCR
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/ian32253188/lending-bot:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # 遠端目前是部署目錄而非 Git checkout，直接同步最新 compose，避免舊設定被沿用。
      - name: Copy production compose to OCI VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_VM_IP }}
          username: ${{ secrets.OCI_VM_USER }}
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          source: "deploy/docker-compose.prod.yml"
          target: "/home/${{ secrets.OCI_VM_USER }}/lending-bot/deploy"
          strip_components: 1
          overwrite: true

      # 透過 SSH 連線至 OCI VM 執行部署指令
      - name: SSH into OCI VM and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_VM_IP }}
          username: ${{ secrets.OCI_VM_USER }}
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          script: |
            set -eu

            # 1. 尋找並進入 VM 上的專案部署目錄（支援多種常見目錄名）
            if [ -d "$HOME/Lending-bot/deploy" ]; then
              cd "$HOME/Lending-bot"
            elif [ -d "$HOME/Lending-bot-master/deploy" ]; then
              cd "$HOME/Lending-bot-master"
            elif [ -d "$HOME/lending-bot/deploy" ]; then
              cd "$HOME/lending-bot"
            else
              echo "找不到專案 deploy 目錄！請確認專案已被複製到 VM 的 $HOME 下"
              exit 1
            fi
            
            # 2. 拉取 GitHub 上的最新程式碼（取得新的 docker-compose.prod.yml）。
            # 不要吞掉 pull 失敗，否則可能用舊 compose 啟動而遺失 PostgreSQL network。
            if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
              git fetch origin main
              git merge --ff-only origin/main
            fi
            
            cd deploy

            # Replace the former Compose fallback (or blank/template values) with
            # a server-only random password. The DB role is synchronized below.
            if [ ! -f ../.env ]; then
              echo "Missing server .env file; configure it before deployment"
              exit 1
            fi
            current_db_password="$(sed -n 's/^POSTGRES_PASSWORD=//p' ../.env | head -n 1)"
            case "$(printf '%s' "$current_db_password" | tr '[:upper:]' '[:lower:]')" in
              *your_*|*change_me*|*default*|*example*|*lending_bot_db_password*) current_db_password="" ;;
            esac
            if [ "${#current_db_password}" -lt 32 ]; then
              new_db_password="$(openssl rand -hex 32)"
              if grep -q '^POSTGRES_PASSWORD=' ../.env; then
                sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=${new_db_password}/" ../.env
              else
                printf '%s=%s\n' POSTGRES_PASSWORD "$new_db_password" >> ../.env
              fi
              chmod 600 ../.env
              echo "Generated a strong PostgreSQL password in the server .env"
            fi

            current_admin_password="$(sed -n 's/^ADMIN_PASSWORD=//p' ../.env | head -n 1)"
            case "$(printf '%s' "$current_admin_password" | tr '[:upper:]' '[:lower:]')" in
              *your_*|*change_me*|*default*|*example*|*admin*|*password*) current_admin_password="" ;;
            esac
            if [ "${#current_admin_password}" -lt 12 ]; then
              new_admin_password="$(openssl rand -hex 32)"
              if grep -q '^ADMIN_PASSWORD=' ../.env; then
                sed -i "s/^ADMIN_PASSWORD=.*/ADMIN_PASSWORD=${new_admin_password}/" ../.env
              else
                printf '%s=%s\n' ADMIN_PASSWORD "$new_admin_password" >> ../.env
              fi
              chmod 600 ../.env
              echo "Generated a new administrator password in the server .env; it is not included in deployment logs"
            fi
            
            # 3. 登入 GHCR 以便拉取映像檔
            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # 4. 拉取最新的 Docker Image
            sudo docker compose --env-file ../.env -f docker-compose.prod.yml pull

            # Validate required secrets before changing any running containers.
            sudo docker compose --env-file ../.env -f docker-compose.prod.yml run --rm --no-deps lending-bot node -e 'require("./server/config")'

            # 5. Confirm this exact compose file defines PostgreSQL before applying it.
            compose_services="$(sudo docker compose --env-file ../.env -f docker-compose.prod.yml config --services)"
            printf 'Compose services: %s\n' "$compose_services"
            printf '%s\n' "$compose_services" | grep -qx postgres

            # 6. Start PostgreSQL first, then synchronize its role password from the
            # container environment. This also migrates existing named volumes.
            sudo docker compose --env-file ../.env -f docker-compose.prod.yml up -d postgres
            attempts=0
            until sudo docker exec lending-bot-postgres sh -c 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"' >/dev/null; do
              attempts=$((attempts + 1))
              if [ "$attempts" -ge 30 ]; then
                echo "PostgreSQL did not become ready within 60 seconds"
                exit 1
              fi
              sleep 2
            done
            sudo docker exec -i lending-bot-postgres sh -c 'exec psql -X -U "$POSTGRES_USER" -d postgres -v ON_ERROR_STOP=1' <<'SQL'
            \getenv db_user POSTGRES_USER
            \getenv db_password POSTGRES_PASSWORD
            ALTER ROLE :"db_user" WITH PASSWORD :'db_password';
            \unset db_password
            \unset db_user
            SQL

            # Start the app after the database password is aligned.
            sudo docker compose --env-file ../.env -f docker-compose.prod.yml up -d lending-bot

            # 7. 驗證應用容器確實能解析並登入同一 Compose 網路中的 PostgreSQL 服務。
            # 不能只以 SSH/Compose 指令成功判定部署完成。
            sudo docker inspect --format='bot={{range $name, $settings := .NetworkSettings.Networks}}{{$name}} {{end}}' bitfinex-lending-bot
            sudo docker inspect --format='postgres={{range $name, $settings := .NetworkSettings.Networks}}{{$name}} {{end}}' lending-bot-postgres
            sudo docker exec bitfinex-lending-bot node -e 'require("dns").lookup(process.env.PGHOST || "postgres", (error, address) => { if (error) { console.error(`PostgreSQL DNS lookup failed: ${error.code} ${error.hostname}`); process.exitCode = 1; } else { console.log(`PostgreSQL DNS resolved: ${address}`); } })'
            sudo docker exec bitfinex-lending-bot node -e 'const { Client } = require("pg"); const client = new Client({ host: process.env.PGHOST || "postgres", port: Number(process.env.PGPORT || 5432), user: process.env.PGUSER || "postgres", password: process.env.PGPASSWORD, database: process.env.PGDATABASE || "lending_bot", connectionTimeoutMillis: 5000 }); client.connect().then(() => client.query("SELECT 1")).then(() => console.log("PostgreSQL SELECT 1 succeeded")).catch(error => { console.error(`PostgreSQL connection check failed: ${error.code || "UNKNOWN"} ${error.hostname || ""}`); process.exitCode = 1; }).finally(() => client.end())'

            # Confirm the protected research status API can read the upgraded schema
            # and that the independent USD collector has written its first minute bar.
            research_status_ok=0
            attempts=0
            while [ "$attempts" -lt 30 ]; do
              research_status="$(sudo docker exec bitfinex-lending-bot node -e 'const jwt = require("jsonwebtoken"); const config = require("./server/config"); const { SINGLE_ACCOUNT_USER_ID } = require("./server/config/single-account"); const token = jwt.sign({ id: SINGLE_ACCOUNT_USER_ID, role: "admin" }, config.jwt.secret); fetch(`http://127.0.0.1:${config.port}/api/research/status`, { headers: { Authorization: `Bearer ${token}` }, cache: "no-store" }).then(async response => { const data = await response.json(); if (!response.ok || !data.databaseReady || !data.market?.fresh || Number(data.market?.count || 0) < 1) { process.exitCode = 1; return; } console.log(`Research dashboard verified: bars=${data.market.count}, latest=${data.market.latestAt || "unknown"}`); }).catch(() => { process.exitCode = 1; })' 2>/dev/null)" || true
              if printf '%s\n' "$research_status" | grep -q '^Research dashboard verified:'; then
                printf '%s\n' "$research_status"
                research_status_ok=1
                break
              fi
              attempts=$((attempts + 1))
              sleep 2
            done
            if [ "$research_status_ok" -ne 1 ]; then
              echo "Research status API or initial USD market write did not become ready within 60 seconds"
              exit 1
            fi

            # 8. 清理舊的不需要的 Docker 映像檔以釋放虛擬機空間
            sudo docker image prune -f
