name: CI/CD Build and Deploy to OCI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install frontend test dependencies
        run: npm ci --prefix client

      - name: Run tests
        run: npm run test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 登入 GitHub Packages (GHCR) 以儲存 Docker 映像檔
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 建置並推送 Docker 映像檔到 GHCR
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/ian32253188/lending-bot:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # 透過 SSH 連線至 OCI VM 執行部署指令
      - name: SSH into OCI VM and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_VM_IP }}
          username: ${{ secrets.OCI_VM_USER }}
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          script: |
            # 1. 尋找並進入 VM 上的專案部署目錄（支援多種常見目錄名）
            if [ -d "$HOME/Lending-bot/deploy" ]; then
              cd "$HOME/Lending-bot"
            elif [ -d "$HOME/Lending-bot-master/deploy" ]; then
              cd "$HOME/Lending-bot-master"
            elif [ -d "$HOME/lending-bot/deploy" ]; then
              cd "$HOME/lending-bot"
            else
              echo "找不到專案 deploy 目錄！請確認專案已被複製到 VM 的 $HOME 下"
              exit 1
            fi
            
            # 2. 拉取 GitHub 上的最新程式碼（取得新的 docker-compose.prod.yml）。
            # 不要吞掉 pull 失敗，否則可能用舊 compose 啟動而遺失 PostgreSQL network。
            git fetch origin main
            git merge --ff-only origin/main
            
            cd deploy
            
            # 3. 登入 GHCR 以便拉取映像檔
            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # 4. 拉取最新的 Docker Image
            sudo docker compose -f docker-compose.prod.yml pull
            
            # 5. 重啟容器以套用更新
            sudo docker compose -f docker-compose.prod.yml up -d
            
            # 6. 清理舊的不需要的 Docker 映像檔以釋放虛擬機空間
            sudo docker image prune -f
