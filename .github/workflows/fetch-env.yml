name: Fetch ENV from OCI

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch .env from OCI VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_VM_IP }}
          username: ${{ secrets.OCI_VM_USER }}
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          script: |
            TARGET_ENV=""
            if [ -f "$HOME/lending-bot/.env" ]; then
              TARGET_ENV="$HOME/lending-bot/.env"
            elif [ -f "$HOME/Lending-bot/.env" ]; then
              TARGET_ENV="$HOME/Lending-bot/.env"
            elif [ -f "$HOME/Lending-bot-master/.env" ]; then
              TARGET_ENV="$HOME/Lending-bot-master/.env"
            else
              TARGET_ENV=$(find $HOME -maxdepth 3 -name ".env" | head -n 1)
            fi

            if [ -n "$TARGET_ENV" ] && [ -f "$TARGET_ENV" ]; then
              echo "FOUND_ENV_START"
              cat "$TARGET_ENV" | base64 -w 0
              echo ""
              echo "FOUND_ENV_END"
            else
              echo "ENV_NOT_FOUND"
              exit 1
            fi
