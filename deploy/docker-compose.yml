version: '3.8'

services:
  lending-bot:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: bitfinex-lending-bot
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ../.env
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
