version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: lending-bot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in ../.env}
      POSTGRES_DB: ${POSTGRES_DB:-lending_bot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-lending_bot}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  lending-bot:
    image: ghcr.io/ian32253188/lending-bot:latest
    container_name: bitfinex-lending-bot
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      # Use explicit PG* settings below. A URI can break when the password
      # contains reserved URL characters, even though PGHOST resolves correctly.
      DATABASE_URL: ''
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in ../.env}
      PGDATABASE: ${POSTGRES_DB:-lending_bot}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
