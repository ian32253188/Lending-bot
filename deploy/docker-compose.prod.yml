version: '3.8'

services:
  lending-bot:
    image: ghcr.io/ian3225318/lending-bot:latest
    container_name: bitfinex-lending-bot
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ../.env
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
