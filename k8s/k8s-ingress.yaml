apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lending-bot-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # 若有使用 cert-manager，可開通以下註解進行 SSL 憑證簽發
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  rules:
    - host: lendingbot.local  # 部署時請替換為您的真實網域
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lending-bot-service
                port:
                  number: 80
  # TLS 設定範本 (HTTPS)
  # tls:
  #   - hosts:
  #       - lendingbot.local
  #     secretName: lending-bot-tls-secret
