apiVersion: v1
kind: Secret
metadata:
  name: lending-bot-secret
  labels:
    app: lending-bot
type: Opaque
stringData:
  # 僅供欄位名稱參考，這些是無效範本值。不要在本檔填入真實憑證或提交已填值的版本。
  # 請從 repository 外的權限受限檔案或 Secret Manager 建立 Kubernetes Secret。
  DATABASE_URL: "postgresql://user:password@postgres.example.invalid:5432/lending_bot?sslmode=verify-full"
  ADMIN_PASSWORD: "your_admin_dashboard_password_here"
  JWT_SECRET: "your_random_jwt_secret_here"
  # Optional Telegram values are intentionally omitted from this template.
